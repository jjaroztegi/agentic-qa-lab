# Business case -> automated test. A key user files a case (n8n form -> PR with catalog/cases/CP-xxx.yaml,
# label "automate"). The agent explores the live QA apps, writes a deterministic Playwright test,
# proves it 3 times and pushes it to the same PR for an automation engineer to review.
# Cases on the L2 desktop client get the desktop agent; web + L2 cases get one cross-system test.
name: author
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      case: { description: "Case id (CP-xxx)", required: true }

permissions: { contents: write, pull-requests: write }

jobs:
  author:
    # Needs the lab's self-hosted runners (docs/operations/runners.md).
    if: vars.QA_LAB_RUNNERS == 'true' && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'automate')
    runs-on: [self-hosted, qa-lab]
    env:
      RUN_ID: "author_${{ github.run_id }}"
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.head_ref || github.ref }}", fetch-depth: 0 }
      - run: npm ci
      - name: Which case
        id: case
        run: |
          if [ -n "${{ inputs.case }}" ]; then echo "id=${{ inputs.case }}" >> "$GITHUB_OUTPUT"; exit 0; fi
          id=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- catalog/cases | head -1 | xargs -r basename | sed 's/\.yaml$//')
          test -n "$id" || { echo "::error::The PR adds no case under catalog/cases"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Agent writes the test on an isolated copy, proven outside the agent (filmed)
        id: author
        env:
          PR_NUMBER: "${{ github.event.pull_request.number }}"
          QA_FROM_SCRATCH: "${{ contains(github.event.pull_request.labels.*.name, 'from-scratch') && '1' || '' }}"
        run: tools/pipeline/author.sh "${{ steps.case.outputs.id }}"
      # Also a red test: when the application does not meet the case, the test is the evidence and
      # turns green once the application is fixed. The PR cannot be merged while it is red.
      - name: Push test + plan for review
        if: always() && steps.case.outputs.id != '' && github.event_name == 'pull_request'
        env: { BRANCH: "${{ github.head_ref || github.ref_name }}", OUTCOME: "${{ steps.author.outcome }}" }
        run: |
          git config user.name "qa-agent"; git config user.email "qa-agent@users.noreply.github.com"
          git add tests/e2e tests/desktop specs
          git diff --cached --quiet && { echo "The agent left no test"; exit 0; }
          if [ "$OUTCOME" = success ]; then
            git commit -m "test: automate ${{ steps.case.outputs.id }} (agent)" -m "Generated by tools/pipeline/author.sh; passed 3 agent runs + 1 run outside the agent."
          else
            git commit -m "test: ${{ steps.case.outputs.id }} test, red until the application meets the case (agent)" -m "Generated by tools/pipeline/author.sh. It fails outside the agent; see the agent report on the PR."
          fi
          git push origin "HEAD:$BRANCH"
      - name: Publish the replay (screen + agent steps)
        id: replay
        if: always()
        run: echo "url=$(tools/pipeline/publish-replay.sh)" >> "$GITHUB_OUTPUT"
      - name: Agent report on the PR (also when it finds a discrepancy)
        if: always() && github.event_name == 'pull_request'
        env: { GH_TOKEN: "${{ github.token }}", REPLAY_URL: "${{ steps.replay.outputs.url }}" }
        run: |
          r=$(tail -1 evidence/author-summary.txt 2>/dev/null || echo '{}')
          { echo "## Agent report · ${{ steps.case.outputs.id }}"; echo
            echo "$r" | jq -r '.result // "The agent did not finish: see the run."'; echo
            [ -n "$REPLAY_URL" ] && echo "[Replay: the run's screen and the agent's steps]($REPLAY_URL)" && echo
            echo "$r" | jq -r '"_" + (((.duration_ms // 0)/60000*10|floor)/10|tostring) + " min of agent time · US$" + ((.total_cost_usd // 0)*100|round/100|tostring) + " · "' | tr -d '\n'
            echo "[run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)_"; } > evidence/author-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file evidence/author-comment.md
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "evidence-${{ env.RUN_ID }}", path: evidence/ }
      - name: Teardown (also when the run is cancelled)
        if: always()
        env: { JOB_STATUS: "${{ job.status }}" }
        run: |
          # A cancelled job never reports its verdict: say so, or the control room shows it running.
          if [ "$JOB_STATUS" = cancelled ]; then
            node tools/emit.mjs event "{\"run\":\"$RUN_ID\",\"source\":\"ci\",\"kind\":\"result\",\"status\":\"warn\",\"title\":\"Cancelled\"}"
          fi
          tools/e2e-env.sh down "$RUN_ID"
